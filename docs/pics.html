    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .12em; color: var(--fg); font-size: 1rem; }
    .brand:hover { text-decoration: none; }
    .brand img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rope); }
    nav.main-nav { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    nav.main-nav a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: .95rem; }
    nav.main-nav a:hover { color: var(--fg); background: var(--bg-soft); text-decoration: none; }
    nav.main-nav a.active { color: var(--brass-bright); }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: .9rem; }
    .btn-brass { background: linear-gradient(135deg, var(--brass), var(--rope)); color: #10192b; }
    nav.main-nav a.btn-brass { color: #10192b; }
    .page-hero { padding: 52px 0 40px; text-align: center; }
    .page-hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.7rem); margin: 0 0 12px; }
    .page-hero p { color: var(--muted); max-width: 680px; margin: 0 auto; }
    section { padding: 48px 0; }
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .gallery figure { margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform .15s ease, border-color .15s ease; }
    .gallery figure:hover { transform: translateY(-3px); border-color: var(--rope); }
    .gallery img { width: 100%; }
    .gallery figcaption { padding: 12px 16px; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--border); }
    .site-footer { padding: 30px 0 40px; border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; }
    .site-footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .footer-note { flex-basis: 100%; font-size: .8rem; opacity: .8; }
    @media (max-width: 700px) { .gallery { grid-template-columns: 1fr; } .site-header .wrap { flex-wrap: wrap; } nav.main-nav { margin-left: 0; width: 100%; justify-content: center; } }
